</head><body><header><h1>비품 신청 시연 v1</h1><p>TeamVibe 로컬 시연 · 외부 통신 제한 · 새로고침하면 실행 상태가 초기화됩니다.</p></header>
<iframe title="통합 코드 실행 미리보기" sandbox="allow-scripts allow-forms" srcdoc="&lt;!doctype html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta http-equiv=&quot;Content-Security-Policy&quot; content=&quot;default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;/head&gt;&lt;body&gt;&lt;!doctype html&gt;&lt;html lang=&quot;ko&quot;&gt;&lt;head&gt;&lt;title&gt;팀 비품 신청&lt;/title&gt;&lt;style&gt;*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#25334e;font:16px/1.7 Arial,sans-serif}main{max-width:760px;margin:55px auto;padding:30px}h1{font-size:30px}p{color:#7d8ca4}form{display:flex;gap:15px;flex-wrap:wrap;padding:25px;background:white;border:1px solid #e0e7f2;border-radius:12px}label{display:flex;flex-direction:column;font-size:14px;gap:7px;flex:1}input{font:inherit;padding:10px;border:1px solid #dce3ee;border-radius:7px;min-width:120px;width:100%}button{font:inherit;padding:9px 15px;border:0;border-radius:7px;background:#365cec;color:white;cursor:pointer;align-self:end}li{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px;background:white;border-radius:8px;margin:12px 0}li span{flex:1}ul{list-style:none;padding:0}li button{font-size:13px;background:#edf2ff;color:#506ec6}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main&gt;&lt;h1&gt;팀 비품 신청&lt;/h1&gt;&lt;p&gt;합성 테스트 시스템&lt;/p&gt;&lt;form id=&quot;request-form&quot;&gt;&lt;label&gt;품목&lt;input id=&quot;item&quot; required&gt;&lt;/label&gt;&lt;label&gt;수량&lt;input id=&quot;quantity&quot; type=&quot;number&quot; min=&quot;1&quot; value=&quot;1&quot; required&gt;&lt;/label&gt;&lt;button type=&quot;submit&quot;&gt;신청하기&lt;/button&gt;&lt;/form&gt;&lt;p id=&quot;status&quot; role=&quot;status&quot;&gt;&lt;/p&gt;&lt;ul id=&quot;requests&quot;&gt;&lt;/ul&gt;&lt;/main&gt;&lt;script  &gt;const form=document.querySelector('#request-form');const requests=document.querySelector('#requests');form.addEventListener('submit',e=&gt;{e.preventDefault();const item=document.querySelector('#item');const qty=document.querySelector('#quantity');if(!item.value.trim()||Number(qty.value)&lt;1)return;const li=document.createElement('li');const label=document.createElement('span');label.textContent=item.value+' · '+qty.value+'개 · 승인 대기';li.append(label);const edit=document.createElement('button');edit.textContent='수정';edit.addEventListener('click',()=&gt;{item.value=label.textContent.split(' · ')[0];li.remove();document.querySelector('#status').textContent='수정 후 다시 신청해 주세요.'});li.append(edit);const remove=document.createElement('button');remove.textContent='취소';remove.addEventListener('click',()=&gt;{li.remove();document.querySelector('#status').textContent='신청을 취소했습니다.'});li.append(remove);requests.prepend(li);document.querySelector('#status').textContent='신청을 등록했습니다.';form.reset()});&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
